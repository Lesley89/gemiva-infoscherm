<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemiva Infoscherm</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f4c81;
    color:white;
}

header{
    background:#08365c;
    text-align:center;
    padding:20px;
}

#clock{
    font-size:36px;
    font-weight:bold;
}

#grid{
    display:grid;
    grid-template-columns:1fr 2fr 1fr;
    gap:15px;
    padding:15px;
}

section{
    background:rgba(255,255,255,0.1);
    border-radius:15px;
    padding:15px;
}

h2{
    margin-top:0;
}
</style>
</head>

<body>

<header>
    <h1>Gemiva Informatiescherm</h1>
    <div id="clock"></div>
</header>

<div id="grid">

<section>
<h2>Weekmenu</h2>

<p>Maandag: Stamppot</p>
<p>Dinsdag: Pasta</p>
<p>Woensdag: Soep</p>
<p>Donderdag: Rijst</p>
<p>Vrijdag: Friet</p>
</section>

<section>
<h2>Mededelingen</h2>

<p>Welkom op onze locatie.</p>
<p>Koffiemoment: 10:30 uur.</p>
<p>Activiteit: 14:00 uur.</p>

</section>

<section>
<h2>Weer</h2>

<p>Oud-Ade</p>
<p>Kijk voor actuele weersinformatie.</p>

</section>

</div>

<script>
function updateClock(){
    document.getElementById('clock').innerHTML =
        new Date().toLocaleString('nl-NL');
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
